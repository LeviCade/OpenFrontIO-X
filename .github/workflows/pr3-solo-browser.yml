name: PR3 Chromium Solo replay persistence
on:
  pull_request:
    paths:
      - "tests/browser/**"
      - ".github/workflows/pr3-solo-browser.yml"
      - "src/client/replay/SoloRecordStore.ts"
      - "src/client/replay/SoloReplayLibrary.ts"
      - "src/client/replay/ReplayRecord.ts"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr3-solo-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solo-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feature/v0352-cloud-solo-10x'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: npm 12
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install application dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated Chromium driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Inspect Chromium executable
        run: command -v google-chrome && google-chrome --version
      - name: Start isolated Vite frontend (no API server)
        shell: bash
        run: |
          set -euo pipefail
          SKIP_BROWSER_OPEN=true npm run start:client -- --host 127.0.0.1 > /tmp/pr3-vite.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:9000/tests/browser/solo-replay-idb.html > /dev/null; then
              echo "Vite fixture is reachable"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr3-vite.log
          exit 1
      - name: Chromium IndexedDB, post-win, export/import and privacy
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser/solo-replay-idb.mjs
      - name: Vite diagnostics if failed
        if: failure()
        run: cat /tmp/pr3-vite.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pr3-solo-browser-vite-log
          path: /tmp/pr3-vite.log
          retention-days: 3
