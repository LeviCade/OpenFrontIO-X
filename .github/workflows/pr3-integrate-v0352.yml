# One-shot exact-tag merge, run exclusively on the isolated PR #3 branch.
# This workflow never checks out or writes the owner's Mac or upstream repo.
name: PR3 exact v0.35.2 upstream integration
on:
  push:
    branches:
      - feature/v0352-cloud-solo-10x
    paths:
      - .github/workflows/pr3-integrate-v0352.yml

permissions:
  contents: write

concurrency:
  group: pr3-upstream-tag-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: "github.event.head_commit.message == 'ci(pr3): launch controlled v0.35.2 merge'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/v0352-cloud-solo-10x
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch ONLY official tag and verify immutable identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/openfrontio/OpenFrontIO.git refs/tags/v0.35.2:refs/tags/pr3-v0352-upstream
          actual="$(git rev-parse refs/tags/pr3-v0352-upstream^{commit})"
          test "$actual" = "08b63c054897c030e6516e0731ab7cc62b2998b7"
          echo "Exact upstream v0.35.2 tag verified: $actual"
          echo "Merge base: $(git merge-base HEAD "$actual")"
          echo "BEFORE:"
          git rev-parse HEAD
      - name: Merge official tag with strict conflict handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openfrontio-x-pr3-ci"
          git config user.email "147657883+LeviCade@users.noreply.github.com"
          if ! git merge --no-commit --no-ff refs/tags/pr3-v0352-upstream; then
            echo "::error::Upstream merge conflicts; no automatic ours/theirs overwrite."
            git ls-files -u
            git diff --name-only --diff-filter=U
            exit 1
          fi
          # Invariants that must survive upstream integration.
          test -f packages/engine-lib/src/game/MapMultiplier.ts
          test -f src/client/replay/SoloRecordStore.ts
          test -f src/client/replay/SoloReplayLibrary.ts
          grep -q 'mapAreaMultiplier' src/client/SinglePlayerModal.ts
          grep -q 'soloJournal' src/client/LocalServer.ts
          grep -q 'MAX_MULTIPLIED_MAP_TILES' packages/engine-lib/src/game/MapMultiplier.ts
          git diff --cached --check
          git status --short
          git commit -m "merge(pr3): integrate exact official OpenFront v0.35.2 tag"
      - name: Push merge only to PR #3
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/feature/v0352-cloud-solo-10x
          echo "Merged tag commit: $(git rev-parse HEAD)"
