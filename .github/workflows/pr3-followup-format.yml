# One-shot project formatter on PR3 only. Self-deletes before committing.
name: PR3 followup source formatter
on:
  push:
    branches:
      - feature/v0352-cloud-solo-10x
    paths:
      - ".github/workflows/pr3-followup-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'ci(pr3): format actual Solo journal compatibility repair'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/v0352-cloud-solo-10x
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install pinned npm and repo deps
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm ci --ignore-scripts
      - name: Run formatter and retire elevated workflow
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          rm -f .github/workflows/pr3-followup-format.yml
          npm run format:check
          git diff --check
          git status --short
          git add -u
          git config user.name "openfrontio-x-pr3-ci"
          git config user.email "147657883+LeviCade@users.noreply.github.com"
          git commit -m "style(pr3): format real Solo early-flush compatibility tests"
          git push origin HEAD:refs/heads/feature/v0352-cloud-solo-10x
