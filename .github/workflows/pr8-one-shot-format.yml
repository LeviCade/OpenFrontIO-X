name: "🧹 PR8 one-shot formatter"

on:
  push:
    branches:
      - feature/virtual-world-special-options-stage4
    paths:
      - .github/workflows/pr8-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'LeviCade/OpenFrontIO-X' && github.ref == 'refs/heads/feature/virtual-world-special-options-stage4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/virtual-world-special-options-stage4
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --ignore-scripts
      - name: Format files exactly as required by CI
        run: |
          set -euo pipefail
          npm run format
          npm run format:check
          git diff --check
      - name: Remove this temporary workflow and publish formatting
        run: |
          set -euo pipefail
          rm .github/workflows/pr8-one-shot-format.yml
          git add -u
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(virtual): apply oxfmt to PR8 source and remove temporary formatter"
          git push origin HEAD:refs/heads/feature/virtual-world-special-options-stage4
