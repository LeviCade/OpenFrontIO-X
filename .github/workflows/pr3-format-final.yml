# Temporary single-branch repair of formatting after PR3 engineering writes.
# Self-destructs, leaving no persistent contents-write automation.
name: PR3 final formatting checkpoint
on:
  push:
    branches:
      - feature/v0352-cloud-solo-10x
    paths:
      - ".github/workflows/pr3-format-final.yml"

permissions:
  contents: write

jobs:
  format-final:
    if: "github.event.head_commit.message == 'ci(pr3): run final formatter'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/v0352-cloud-solo-10x
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install pinned npm and dependencies
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm ci --ignore-scripts
      - name: Format, verify, and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          rm -f .github/workflows/pr3-format-final.yml
          npm run format:check
          git diff --check
          git status --short
          git add -u
          git config user.name "openfrontio-x-pr3-ci"
          git config user.email "147657883+LeviCade@users.noreply.github.com"
          git commit -m "style(pr3): finalize formatting and retire self-limited workflow"
          git push origin HEAD:refs/heads/feature/v0352-cloud-solo-10x
